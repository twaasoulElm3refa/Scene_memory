# Redis settings for Scemory (cache, queues, sessions, locks, rate limits).
# Template: merge into the server's redis.conf; never run FLUSHALL on production.

bind 127.0.0.1 ::1
protected-mode yes
# requirepass <set a long random password and put it in REDIS_PASSWORD>

# Queued jobs, sessions and payment locks must never be evicted. With one Redis
# instance for everything, use noeviction and size maxmemory with headroom; alert at
# 80% use. If cache growth is a problem, run a second instance for the cache only
# with maxmemory-policy allkeys-lru and point the "cache" connection at it.
maxmemory 1gb
maxmemory-policy noeviction

# Persistence: queues and sessions survive a restart.
appendonly yes
appendfsync everysec

# Laravel uses separate logical databases: REDIS_DB (queues, sessions) and
# REDIS_CACHE_DB (cache). `php artisan cache:clear` only clears the cache database.
databases 16
