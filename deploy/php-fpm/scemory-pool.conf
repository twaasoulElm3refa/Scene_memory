; PHP-FPM pool sizing for Scemory. Template: merge into the existing pool file; do not
; replace user/group/listen lines that CWP already manages.
;
; Size pm.max_children from measured memory, not from this file:
;   max_children = (RAM for PHP) / (average RSS of one worker)
;   e.g. 4 GB for PHP / ~80 MB per worker = 50; keep headroom for MySQL and Redis.
; Measure RSS with: ps -o rss,cmd -C php-fpm | sort -n | tail
; The values below assume about 2 GB for PHP and are a starting point only.

pm = dynamic
pm.max_children = 24
pm.start_servers = 6
pm.min_spare_servers = 4
pm.max_spare_servers = 10
; Recycle workers so slow leaks never accumulate.
pm.max_requests = 1000
; Kill a request that outlives PHP's own limit (max_execution_time = 300).
request_terminate_timeout = 320s
; Find slow endpoints without a profiler.
request_slowlog_timeout = 5s
slowlog = /var/log/php-fpm/scemory-slow.log
; Expose status for local monitoring only (allow it from 127.0.0.1 in the web server).
pm.status_path = /fpm-status
