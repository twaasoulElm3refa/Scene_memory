; PHP settings for the Scemory web SAPI (PHP-FPM or Apache mod_php) in production.
; Template: compare with the server's current php.ini before applying, then reload PHP.
; On CWP, PHP-FPM selector files usually live under /opt/alt/php-fpmXX/usr/etc/ or
; /usr/local/php-fpmXX/etc/; keep the existing pool and only add these values.

; --- OPcache: compile PHP once instead of on every request ---
opcache.enable=1
opcache.memory_consumption=256
opcache.interned_strings_buffer=32
opcache.max_accelerated_files=30000
; Deployments replace files, so stop checking timestamps on every request and
; reset OPcache on deploy instead (php-fpm reload, or `php artisan opcache:clear`
; if a package provides it). Use 1 if code is ever edited in place on the server.
opcache.validate_timestamps=0
opcache.save_comments=1
opcache.jit=off

; --- Request limits (must agree with Laravel validation and the web server) ---
; Media rule: 20460 KB per file, several files per request.
upload_max_filesize=100M
post_max_size=100M
; The web server's proxy/read timeout must be at least this long, or clients get a
; 504 while PHP keeps working.
max_execution_time=300
max_input_time=300
memory_limit=256M

; --- Safety ---
expose_php=Off
display_errors=Off
log_errors=On
session.cookie_secure=1
session.cookie_httponly=1
realpath_cache_size=4096K
realpath_cache_ttl=600
