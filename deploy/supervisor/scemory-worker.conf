; Supervisor programs for Scemory queue workers. Template: adjust paths and user.
; With these running, remove the scheduler's fallback `queue:work --stop-when-empty`
; entry only after workers have been stable for a few days.
;
; Long video jobs (timeout 1200 s) block everything behind them on a single worker,
; so run at least two processes. REDIS_QUEUE_RETRY_AFTER (1260) must stay above
; --timeout.

[program:scemory-worker]
command=php /home/scemory/public_html/artisan queue:work redis --queue=default --sleep=3 --tries=3 --timeout=1200 --max-time=3600 --memory=512
process_name=%(program_name)s_%(process_num)02d
numprocs=2
directory=/home/scemory/public_html
user=scemory
autostart=true
autorestart=true
stopwaitsecs=1260
stopasgroup=true
killasgroup=true
redirect_stderr=true
stdout_logfile=/home/scemory/logs/worker.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
