; OPcache for the app image. Timestamps are still validated because docker-compose
; mounts the working tree; production without a code mount can use
; deploy/php/scemory-production.ini (validate_timestamps=0 + reload on deploy).
opcache.enable=1
opcache.enable_cli=0
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
opcache.validate_timestamps=1
opcache.revalidate_freq=2
opcache.save_comments=1
